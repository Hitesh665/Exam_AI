<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ExamAI - Login & Registration</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css?v=2.2">
</head>
<body class="auth-page">

  <!-- Background Ambient Glow -->
  <div class="auth-page__ambient"></div>

  <!-- Top Bar with Theme Toggle -->
  <header class="auth-page__header">
    <div class="auth-page__brand">
      <svg class="auth-page__logo-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M22 10v6M2 10l10-5 10 5-10 5z"/>
        <path d="M6 12v5c3 3 9 3 12 0v-5"/>
      </svg>
      <span class="auth-page__brand-name">Exam<span>AI</span></span>
    </div>
    <button id="themeToggleBtn" class="btn-icon" aria-label="Toggle color theme" title="Toggle color theme">
      <svg class="icon icon--sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="12" cy="12" r="5"/>
        <line x1="12" y1="1" x2="12" y2="3"/>
        <line x1="12" y1="21" x2="12" y2="23"/>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/>
        <line x1="1" y1="12" x2="3" y2="12"/>
        <line x1="21" y1="12" x2="23" y2="12"/>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/>
      </svg>
      <svg class="icon icon--moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/>
      </svg>
    </button>
  </header>

  <!-- Centered Auth Card Container -->
  <main class="auth-card">
    <div class="auth-card__header">
      <div class="auth-card__icon-badge">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"/>
        </svg>
      </div>
      <h1 class="auth-card__title">Master Your Exams with AI</h1>
      <p class="auth-card__subtitle">Your intelligent tutor for conceptual clarity, question papers, and grading.</p>
    </div>

    <!-- Segmented Tab Switcher -->
    <div class="auth-tabs" role="tablist">
      <button type="button" id="tabLogin" class="auth-tabs__btn auth-tabs__btn--active" role="tab" aria-selected="true" aria-controls="loginForm">
        Sign In
      </button>
      <button type="button" id="tabSignup" class="auth-tabs__btn" role="tab" aria-selected="false" aria-controls="signupForm">
        Create Account
      </button>
    </div>

    <!-- Alert / Toast Display inside Card -->
    <div id="authAlert" class="alert alert--hidden" role="alert">
      <span id="authAlertMessage"></span>
    </div>

    <!-- Sign In Form -->
    <form id="loginForm" class="auth-form" novalidate>
      <div class="form-group">
        <label for="loginEmail" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="loginEmail" class="form-input" placeholder="student@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <div class="form-label-row">
          <label for="loginPassword" class="form-label">Password</label>
        </div>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="loginPassword" class="form-input" placeholder="••••••••" required autocomplete="current-password">
          <button type="button" class="btn-toggle-password" data-target="loginPassword" aria-label="Toggle password visibility">
            <svg class="icon icon--eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon icon--eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="loginSubmitBtn" class="btn btn--primary btn--block">
        <span class="btn__text">Sign In</span>
        <span class="btn__spinner" style="display:none;"></span>
      </button>
    </form>

    <!-- Sign Up Form (Initially hidden) -->
    <form id="signupForm" class="auth-form" style="display: none;" novalidate>
      <div class="form-group">
        <label for="signupName" class="form-label">Full Name</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/>
            <circle cx="12" cy="7" r="4"/>
          </svg>
          <input type="text" id="signupName" class="form-input" placeholder="Alex Johnson" required autocomplete="name">
        </div>
      </div>

      <div class="form-group">
        <label for="signupEmail" class="form-label">Email Address</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/>
            <polyline points="22,6 12,13 2,6"/>
          </svg>
          <input type="email" id="signupEmail" class="form-input" placeholder="student@example.com" required autocomplete="email">
        </div>
      </div>

      <div class="form-group">
        <label for="signupPassword" class="form-label">Password (min. 6 characters)</label>
        <div class="input-wrapper">
          <svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
            <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
            <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
          </svg>
          <input type="password" id="signupPassword" class="form-input" placeholder="••••••••" required minlength="6" autocomplete="new-password">
          <button type="button" class="btn-toggle-password" data-target="signupPassword" aria-label="Toggle password visibility">
            <svg class="icon icon--eye" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
              <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
              <circle cx="12" cy="12" r="3"/>
            </svg>
            <svg class="icon icon--eye-off" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="display:none;">
              <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
              <line x1="1" y1="1" x2="23" y2="23"/>
            </svg>
          </button>
        </div>
      </div>

      <button type="submit" id="signupSubmitBtn" class="btn btn--primary btn--block">
        <span class="btn__text">Create Account</span>
        <span class="btn__spinner" style="display:none;"></span>
      </button>
    </form>

    <footer class="auth-card__footer">
      <p>Secure login with JWT & Bcrypt • Cloud-backed Authentication</p>
    </footer>
  </main>

  <script src="auth.js?v=2.2"></script>
</body>
</html>
